apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storageclasses
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nishank841/kube-helm.git
    targetRevision: main
    path: manifests/storageclass

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
